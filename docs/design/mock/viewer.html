<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面のモック（手元の閲覧）</title>
<style>
  :root { color-scheme: light dark; --bg:#eceae6; --fg:#1d1d1b; --muted:#6b6a66; --card:#fff; --line:#d4d1cb; --accent:#2d5bd7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1a; --fg:#ecebe8; --muted:#9b9a95; --card:#262624; --line:#3a3936; --accent:#7ea2ff; } }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; overflow:hidden; }
  header { position:fixed; inset:0 0 auto 0; height:48px; display:flex; align-items:center; gap:12px; padding:0 14px; background:var(--card); border-bottom:1px solid var(--line); z-index:10; }
  header h1 { font-size:14px; margin:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:32vw; }
  nav { display:flex; gap:4px; }
  nav button, .tools button { font:inherit; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .tools { margin-left:auto; display:flex; gap:6px; align-items:center; color:var(--muted); font-variant-numeric:tabular-nums; }
  #stage { position:absolute; inset:48px 0 0 0; overflow:hidden; cursor:grab; touch-action:none; }
  #stage.dragging { cursor:grabbing; }
  #world { position:absolute; left:0; top:0; transform-origin:0 0; }
  .board { position:absolute; }
  .board .label { position:absolute; left:0; right:0; bottom:100%; padding-bottom:8px; font-size:22px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .board .label a { color:inherit; text-decoration:none; }
  .board .label a:hover { color:var(--accent); text-decoration:underline; }
  .board .frame { width:100%; height:100%; background:#fff; border-radius:6px; box-shadow:0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); overflow:hidden; }
  .board iframe { border:0; width:100%; height:100%; display:block; pointer-events:none; }
  body.interact .board iframe { pointer-events:auto; }
  .note { position:absolute; white-space:pre-wrap; }
  .note.title1 { font-size:44px; font-weight:700; line-height:1.2; width:max-content; }
  .note.sticky { background:#fff3a8; color:#2a2614; padding:18px 20px; border-radius:4px; font-size:20px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .note.plain { background:var(--card); padding:18px 20px; border-radius:6px; font-size:20px; border:1px solid var(--line); }
  #err { position:fixed; inset:48px 0 auto 0; padding:16px; color:#b3261e; display:none; }
</style>
</head>
<body>
<header>
  <h1 id="title">画面のモック</h1>
  <nav id="pages" aria-label="ページ"></nav>
  <div class="tools">
    <label title="印を付けると、並んだ画面の中でクリックやスクロールができる。外すと、ドラッグでキャンバス全体を動かせる"><input type="checkbox" id="interact"> 画面の中を操作する</label>
    <button type="button" id="fit">全体を見る</button>
    <button type="button" id="zoomout" aria-label="縮小">−</button>
    <span id="zoom">100%</span>
    <button type="button" id="zoomin" aria-label="拡大">＋</button>
  </div>
</header>
<div id="stage"><div id="world"></div></div>
<div id="err"></div>
<script>
// docs/design/mock/project/canvas.json を読み、キャンバスと同じ位置に枚（iframe）と付箋を置く。
// 枚のファイルはキャンバスの型が配る support.js を読むが、リポジトリには置かないため、テーマの切り替えは効かない。
const BASE = 'project/';
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const view = { x: 0, y: 0, s: 0.25 };
let canvas, page;

function apply() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.s})`;
  document.getElementById('zoom').textContent = Math.round(view.s * 100) + '%';
}

function zoomAt(factor, cx, cy) {
  const s = Math.min(2, Math.max(0.03, view.s * factor));
  view.x = cx - (cx - view.x) * (s / view.s);
  view.y = cy - (cy - view.y) * (s / view.s);
  view.s = s;
  apply();
}

function itemsOf(p) {
  const boards = Object.entries(canvas.boards).filter(([, b]) => b.page === p);
  const notes = Object.entries(canvas.notes || {}).filter(([, n]) => n.page === p);
  return { boards, notes };
}

function fit() {
  const { boards, notes } = itemsOf(page);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [, b] of boards) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y - 40); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  for (const [, n] of notes) { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + (n.w || n.maxW || 400)); y1 = Math.max(y1, n.y + 80); }
  if (!isFinite(x0)) return;
  const r = stage.getBoundingClientRect(), pad = 40;
  view.s = Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0), 1);
  view.x = pad - x0 * view.s + ((r.width - pad * 2) - (x1 - x0) * view.s) / 2;
  view.y = pad - y0 * view.s;
  apply();
}

function render(p) {
  page = p;
  for (const b of document.querySelectorAll('#pages button')) b.setAttribute('aria-pressed', String(b.dataset.page === p));
  world.replaceChildren();
  const { boards, notes } = itemsOf(p);
  const order = canvas.order || [];
  boards.sort(([a], [b]) => order.indexOf(a) - order.indexOf(b));
  for (const [file, b] of boards) {
    const el = document.createElement('div');
    el.className = 'board';
    Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
    const label = document.createElement('div');
    label.className = 'label';
    const a = document.createElement('a');
    a.href = BASE + file; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = `${b.title || file}（${file}）`;
    label.append(a);
    const frame = document.createElement('div');
    frame.className = 'frame';
    const f = document.createElement('iframe');
    f.loading = 'lazy'; f.title = b.title || file; f.src = BASE + file;
    frame.append(f);
    el.append(label, frame);
    world.append(el);
  }
  for (const [, n] of notes) {
    const el = document.createElement('div');
    el.className = 'note ' + (n.kind === 'title1' ? 'title1' : n.fill === 'yellow' ? 'sticky' : 'plain');
    Object.assign(el.style, { left: n.x + 'px', top: n.y + 'px' });
    if (n.w) el.style.width = n.w + 'px';
    if (n.maxW) el.style.maxWidth = n.maxW + 'px';
    el.textContent = n.text;
    world.append(el);
  }
  history.replaceState(null, '', '#' + p);
  fit();
}

// 動かし方: ドラッグで移動、ホイール（またはピンチ）で拡大・縮小
let drag = null;
stage.addEventListener('pointerdown', e => {
  if (document.body.classList.contains('interact') && e.target.closest('.board')) return;
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
  stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; apply();
});
stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('dragging'); });
stage.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) > Math.abs(e.deltaX)) zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; apply(); }
}, { passive: false });
const center = () => { const r = stage.getBoundingClientRect(); return [r.width / 2, r.height / 2]; };
document.getElementById('zoomin').onclick = () => zoomAt(1.25, ...center());
document.getElementById('zoomout').onclick = () => zoomAt(0.8, ...center());
document.getElementById('fit').onclick = fit;
document.getElementById('interact').onchange = e => document.body.classList.toggle('interact', e.target.checked);
addEventListener('resize', fit);

fetch(BASE + 'canvas.json').then(r => {
  if (!r.ok) throw new Error(`canvas.json を読めない（HTTP ${r.status}）`);
  return r.json();
}).then(c => {
  canvas = c;
  document.getElementById('title').textContent = c.title || '画面のモック';
  document.title = (c.title || '画面のモック') + '（手元の閲覧）';
  const nav = document.getElementById('pages');
  for (const p of c.pages || []) {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.page = p.id;
    const n = Object.values(c.boards).filter(x => x.page === p.id).length;
    b.textContent = `${p.name}（${n}）`;
    b.onclick = () => render(p.id);
    nav.append(b);
  }
  const want = decodeURIComponent(location.hash.slice(1));
  const ids = (c.pages || []).map(p => p.id);
  render(ids.includes(want) ? want : (c.launch && c.launch.page) || ids[0]);
}).catch(e => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = e.message + '。ファイルを直に開くとブラウザが読み込みを止めるので、python3 -m http.server --bind 127.0.0.1 -d docs/design/mock を打って http://localhost:8000/viewer.html を開く。';
});
</script>
</body>
</html>
