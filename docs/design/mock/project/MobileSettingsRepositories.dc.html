<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: リポジトリの連携</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileSettingsMenu.dc.html" aria-label="アカウントの設定へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">リポジトリの連携</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">GitHub App を入れたリポジトリを登録し、実行の手段と同時の実行の数を決めます</p>
  <div class="m-body">
    <span class="sm muted">個人のアカウント</span>
    <div class="col" style="gap:8px"><a class="btn" href="#">GitHub App をリポジトリへ入れる</a><button class="btn" type="button">GitHub で確かめる</button></div>
    <section class="card"><div class="card-h"><h3>登録したリポジトリ（2）</h3></div>
      <div class="m-list" style="border:0;border-radius:0">
        <div class="m-item"><span class="row between"><span class="b mono sm">example-org/api</span><span class="xs muted">11/11</span></span><div class="acts"><div class="field full"><label for="e1">実行の手段</label><select id="e1" class="sel"><option>手元のマシン（どの 1 台でも）</option><option>既定</option><option>手元のマシン 作業用の PC</option></select></div><div class="row" style="gap:8px;width:100%"><input class="in grow" aria-label="同時の実行の数" placeholder="同時の実行の数"><button class="btn" type="button">宣言する</button></div><button class="btn danger" type="button">外す</button></div></div>
        <div class="m-item"><span class="row between"><span class="b mono sm">example-org/web</span><span class="xs muted">11/11</span></span><div class="acts"><div class="field full"><label for="e2">実行の手段</label><select id="e2" class="sel"><option>既定</option></select></div><div class="row" style="gap:8px;width:100%"><input class="in grow" aria-label="同時の実行の数" placeholder="同時の実行の数"><button class="btn" type="button">宣言する</button></div><button class="btn danger" type="button">外す</button></div></div>
      </div>
      <div class="card-f"><span class="note">同時の実行の数は空なら料金プランの値。1 から 100 の整数</span></div>
    </section>
    <section class="card"><div class="card-h"><h3>登録の候補</h3></div>
      <div class="m-list" style="border:0;border-radius:0">
        <div class="m-item"><span class="row between"><span class="mono sm">example-org/api</span><span class="xs muted">登録済み</span></span></div>
        <div class="m-item"><span class="row between"><span class="mono sm">example-org/web</span><span class="xs muted">登録済み</span></span></div>
        <div class="m-item"><span class="row between"><span class="mono sm">example-org/docs</span></span><div class="acts"><button class="btn primary" type="button">登録する</button></div></div>
      </div>
    </section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
