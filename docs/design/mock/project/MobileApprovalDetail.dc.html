<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: 承認の詳細</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileHome.dc.html" aria-label="承認待ちの一覧へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">設計承認ゲート</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">設計を読んで、実装へ進めてよいかを答えます</p>
  <div class="m-body">
    <div class="col" style="gap:6px"><span class="b">#1 画面から形態 local の実行を始める</span><span class="mono xs muted">example-org/api・PR #4</span><span class="row"><span class="badge approval">承認待ち</span><span class="xs muted">3 時間前から</span></span></div>
    <div class="tabs"><a class="on" href="#">資料</a><a href="#">差分</a><a href="#">検査 4/4</a></div>
    <section class="card"><div class="card-h"><h2>要求と受け入れ条件</h2></div>
      <div class="card-b prose sm"><p>画面から形態 local のスプリントの実行を始め、手元のマシンが 120 秒以内に受け取って running になることを確かめる。</p><ul><li>手元のマシンが「つながっている」で出る</li><li>120 秒以内に受け取る</li></ul></div></section>
    <section class="card"><div class="card-h"><h2>答える</h2></div>
      <div class="card-b">
        <p class="xs muted">承認すると設計 PR をマージし、実装へ進む。差し戻すと理由を添えて設計をやり直す</p>
        <div class="field full"><label for="r">差し戻す理由（差し戻しでは必須）</label><textarea id="r" class="ta"></textarea></div>
      </div></section>
  </div>
  <div class="m-bar"><button class="btn danger" type="button">差し戻す</button><button class="btn approve" type="button">承認する</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
