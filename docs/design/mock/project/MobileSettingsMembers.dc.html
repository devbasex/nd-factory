<x-dc>
<helmet>

.m .btn.sm{height:44px;font-size:15px}

<div class="{{theme}}">

    </section>
    <section class="card"><div class="card-h"><h3>席（3）</h3></div>

        <div class="m-item"><span class="row between"><span class="mono sm">usr_7f3a…</span><span class="badge neutral">あなた</span></span><span class="xs muted">GitHub・管理者・2026/11/10</span></div>

      </div>
    </section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
