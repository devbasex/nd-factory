<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: ホーム</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect class="bg" width="32" height="32" rx="7"></rect><path class="ln" d="M9.5 23V9l13 14V9"></path><circle class="fg" cx="9.5" cy="23" r="2.8"></circle><circle class="fg" cx="9.5" cy="9" r="2.8"></circle><circle class="fg" cx="22.5" cy="23" r="2.8"></circle><circle class="fg" cx="22.5" cy="9" r="2.8"></circle></svg><span class="t">ホーム</span>
    <button class="m-icon" type="button" aria-label="移動と操作"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">あなたを待っている承認と、動いている実行の今です</p>
  <div class="m-body">
    <div class="row between"><span class="sm muted">個人のアカウント</span><span class="conn">オンライン</span></div>
    <div class="tiles">
      <div class="tile attn"><span class="k">承認待ち</span><span class="v">2</span></div>
      <div class="tile"><span class="k">動いている</span><span class="v">1</span></div>
    </div>
    <section class="card hl">
      <div class="card-h"><h2>承認待ち（2 件）</h2></div>
      <div>
        <a class="m-item" href="MobileApprovalDetail.dc.html"><span class="row between"><span class="badge approval">設計承認ゲート</span><span class="xs muted">3 時間前</span></span><span class="b sm">#1 画面から形態 local の実行を始める</span><span class="mono xs muted">example-org/api</span></a>
        <a class="m-item" href="MobileApprovalDetail.dc.html"><span class="row between"><span class="badge approval">リリース承認ゲート</span><span class="xs muted">25 分前</span></span><span class="b sm">#3 通知の文言をそろえる</span><span class="mono xs muted">example-org/web</span></a>
      </div>
    </section>
    <section class="card">
      <div class="card-h"><h2>動いているスプリントの実行</h2></div>
      <a class="m-item" href="MobileSprintDetail.dc.html"><span class="row between"><span class="b sm">#1 example-org/api</span><span class="badge approval">承認待ち</span></span><span class="phases"><i class="g"></i><i></i><i></i><i></i><i></i></span></a>
    </section>
    <a class="btn" href="Mobile.dc.html">スプリントの一覧へ</a>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
