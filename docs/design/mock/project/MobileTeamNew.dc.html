<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>

<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileMeTeams.dc.html" aria-label="所属チームへ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>

  </header><p class="m-desc">複数人で使うチームのアカウントを作ります。作った人が持ち主になります</p>

    <section class="card"><div class="card-h"><h2>チーム</h2></div>
      <div class="card-b"><div class="field full"><label for="tn">チームの名前</label><input id="tn" class="in" value="example-team"><span class="help">あとから一般の設定で変えられます</span></div><span class="xs muted">作ったあなたが管理者の席を持ちます</span></div>
    </section>
  </div>
  <div class="m-bar"><a class="btn" href="MobileMeTeams.dc.html">やめる</a><button class="btn primary" type="button">チームを作る</button></div>
</div>
</div>
