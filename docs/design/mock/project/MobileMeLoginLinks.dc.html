<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: ログインの連携</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileAccount.dc.html" aria-label="自分の設定へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">ログインの連携</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">Google と GitHub のどちらでも、同じ利用者としてログインできるようにつなぎます</p>
  <div class="m-body">
    <p class="sm muted" style="margin:0">Google と GitHub のアカウントを自分につなぐと、どちらでログインしても同じ利用者として使えます。メールアドレスではまとめません</p>
    <section class="card"><div class="card-h"><h3>ログインの手段</h3></div>
      <div class="m-list" style="border:0;border-radius:0">
        <div class="m-item"><span class="row between"><span class="b sm">GitHub</span><span class="badge done">つないでいる</span></span><span class="xs muted">最初のログインの手段・2026/11/10 につないだ</span></div>
        <div class="m-item"><span class="row between"><span class="b sm">Google</span><span class="xs muted">つないでいない</span></span><div class="acts"><button class="btn primary" type="button">つなぐ</button></div></div>
      </div>
      <div class="card-f"><span class="note">外すと、この IdP のアカウントでのログインは別の利用者になります</span></div>
    </section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
