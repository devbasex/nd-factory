<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: スプリントを始める</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
.m .card-h .btn{height:44px}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileRepositoryDetail.dc.html" aria-label="リポジトリの詳細へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">スプリントを始める</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">AI が選んだ課題を確かめ、足す・外すをしてから開始します</p>
  <div class="m-body">
    <span class="mono xs muted">example-org/api</span>
    <section class="card"><div class="card-h"><h2>選んだ課題（2 件）</h2><button class="btn" type="button" style="margin-left:auto">AI に選び直させる</button></div>
      <div class="m-list" style="border:0;border-radius:0">
        <div class="m-item"><span class="row between"><span class="b sm">#1 画面から形態 local の実行を始める</span></span><span class="xs muted">動作の根幹に関わるため次のスプリントに含める</span><div class="acts"><button class="btn" type="button">外す</button></div></div>
        <div class="m-item"><span class="row between"><span class="b sm">#5 README の手順を直す</span></span><span class="xs muted">手で足した</span><div class="acts"><button class="btn" type="button">外す</button></div></div>
      </div>
    </section>
    <section class="card"><div class="card-h"><h2>ほかの候補</h2></div>
      <div class="card-b"><div class="row" style="gap:8px"><input class="in grow" aria-label="課題の番号" placeholder="課題の番号"><button class="btn" type="button">足す</button></div><label class="check"><input type="checkbox"><span>#6 承認の通知を Slack に送る</span></label><label class="check"><input type="checkbox"><span>#7 ログの表示を短くする</span></label></div>
    </section>
    <section class="card"><div class="card-h"><h3>このスプリント</h3></div>
      <div class="card-b"><dl class="dl"><dt>課題</dt><dd>#1・#5</dd><dt>実行の手段</dt><dd>手元のマシン（どの 1 台でも）</dd><dt>同時の実行</dt><dd>0 / 1 本</dd></dl><a class="sm" href="MobileSettingsRepositories.dc.html">リポジトリの設定で変える</a></div>
    </section>
  </div>
  <div class="m-bar"><button class="btn primary" type="button">開始する</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
