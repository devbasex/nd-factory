<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: 開発計画を作る</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobilePlans.dc.html" aria-label="開発計画へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">開発計画を作る</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">対象と課題を選ぶと、AI が課題をレーンに割り振ります</p>
  <div class="m-body">
    <section class="card"><div class="card-h"><h2>1. 対象と名前</h2></div>
      <div class="card-b"><div class="field full"><label for="repo">対象のリポジトリ</label><select id="repo" class="sel"><option>example-org/api</option><option>example-org/web</option></select><span class="help">課題はこのリポジトリから選びます</span></div><div class="field full"><label for="pn">計画の名前（任意）</label><input id="pn" class="in" value="マイルストーン 02 の残り"><span class="help">100 字まで</span></div></div>
    </section>
    <section class="card"><div class="card-h"><h2>2. 課題を選ぶ</h2><span class="xs muted">4 件 / 50 件まで</span></div>
      <div class="card-b"><div class="row" style="gap:8px"><input id="add" class="in grow" aria-label="課題の番号" placeholder="課題の番号"><button class="btn" type="button">足す</button></div><label class="check"><input type="checkbox" checked=""><span>#12 承認の資料に差分の要約を載せる</span></label><label class="check"><input type="checkbox" checked=""><span>#14 通知の文言をそろえる</span></label><label class="check"><input type="checkbox" checked=""><span>#15 失敗の理由を一覧に出す</span></label><label class="check"><input type="checkbox" checked=""><span>#18 予算の残りを周回ごとに記録する</span></label><label class="check"><input type="checkbox"><span>#21 ダークの札のコントラストを上げる</span></label><button class="btn" type="button">割り振りの案を作る</button><span class="xs muted">割り振りはオーガナイザーが作ります。画面では直しません</span></div>
    </section>
    <section class="card"><div class="card-h"><h2>3. 案を確かめる</h2><span class="badge done">案ができた</span></div>
      <div class="m-list" style="border:0;border-radius:0">
        <div class="m-item"><span class="row between"><span class="b">L1</span><span class="xs muted">2 行</span></span><span class="sm">1. #12　2. #18</span></div>
        <div class="m-item"><span class="row between"><span class="b">L2</span><span class="xs muted">1 行</span></span><span class="sm">1. #14</span></div>
        <div class="m-item"><span class="row between"><span class="b">L3</span><span class="xs muted">1 行</span></span><span class="sm">1. #15</span><span class="xs muted">L1 の 1 行目の後に流す</span></div>
      </div>
    </section>
    <section class="card"><div class="card-h"><h3>この計画で動くもの</h3></div>
      <div class="card-b"><dl class="dl"><dt>課題</dt><dd>4 件</dd><dt>レーン</dt><dd>3 本</dd><dt>同時の上限</dt><dd>1 本（料金プランの値）</dd><dt>実行の手段</dt><dd>手元のマシン（どの 1 台でも）</dd></dl></div>
    </section>
  </div>
  <div class="m-bar"><a class="btn" href="MobilePlans.dc.html">やめる</a><button class="btn primary" type="button">この案で始める</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
