<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: スプリントの詳細</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .step{padding:10px 12px;grid-template-columns:20px minmax(0,1fr) auto}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="Mobile.dc.html" aria-label="スプリントの一覧へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">#1 example-org/api</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">このスプリントの工程の進みと、次にすることです</p>
  <div class="m-body">
    <div class="col" style="gap:8px"><span class="b">画面から形態 local の実行を始める</span><span class="row"><span class="badge approval">承認待ち</span><span class="xs muted">NDF 10.27.60・local</span></span></div>
    <div class="alert warning"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3 2 21h20z"></path></svg><span class="grow sm">設計承認ゲートで承認を待っています</span></div>
    <section class="card">
      <div class="card-h"><h2>工程の行</h2><span class="xs muted">設計 3 / 4</span></div>
      <div class="phase-h"><span>設計</span></div>
      <div class="steps">
        <div class="step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--done)" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg><span class="sm">要求と受け入れ条件</span><span class="badge done">終了</span></div>
        <div class="step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--done)" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg><span class="sm">設計</span><span class="badge done">終了</span></div>
        <div class="step"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--approval)" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg><span class="sm">ドキュメントレビュー</span><span class="badge approval">承認待ち</span></div>
      </div>
    </section>
    <section class="card"><div class="card-h"><h3>概要</h3></div>
      <div class="card-b"><dl class="dl" style="grid-template-columns:110px minmax(0,1fr)">
        <dt>場所</dt><dd>手元 作業用の PC</dd><dt>始めた日時</dt><dd>11/13 15:29</dd><dt>費用</dt><dd>$0.17</dd>
      </dl></div></section>
  </div>
  <div class="m-bar"><a class="btn approve" href="MobileApprovalDetail.dc.html">承認の詳細を開く</a></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
