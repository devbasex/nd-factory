<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: アカウントの設定</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m-nav{border:1px solid var(--border);border-radius:6px;overflow:hidden}
.m-nav a:last-child,.m-nav span:last-child{border-bottom:0}
.m-nav a.on{background:var(--selected);font-weight:600}
.m-nav .dis{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 12px;color:var(--muted)}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect class="bg" width="32" height="32" rx="7"></rect><path class="ln" d="M9.5 23V9l13 14V9"></path><circle class="fg" cx="9.5" cy="23" r="2.8"></circle><circle class="fg" cx="9.5" cy="9" r="2.8"></circle><circle class="fg" cx="22.5" cy="23" r="2.8"></circle><circle class="fg" cx="22.5" cy="9" r="2.8"></circle></svg><span class="t">アカウントの設定</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">このアカウントの実行の手段・リポジトリ・通知などを決めます</p>
  <div class="m-body">
    <span class="sm muted">個人のアカウント</span>
    <nav class="m-nav" aria-label="アカウントの設定の項目">
      <a href="#">一般<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a class="on" href="#" aria-current="page">実行の手段<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="#">リポジトリの連携<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="#">モードごとの工程<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="#">マシン<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <a href="#">通知<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
      <span class="dis">請求と使用量<span class="pill">予定</span></span>
    </nav>
    <section class="card"><div class="card-h"><h2>月の上限額</h2></div>
      <div class="card-b"><div class="field full"><label for="c">月の上限額（USD。空は 0）</label><input id="c" class="in" value="50"></div><button class="btn primary" type="button">上限額を変える</button></div></section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
