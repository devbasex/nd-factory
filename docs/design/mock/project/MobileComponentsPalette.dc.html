<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: 部品（コマンドパレット）</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.psheet{width:390px;min-height:844px;box-sizing:border-box;background:var(--base);display:flex;flex-direction:column}
.psheet .q{display:flex;align-items:center;gap:8px;height:56px;padding:0 8px 0 16px;border-bottom:1px solid var(--border)}
.psheet .q input{flex:1;height:44px;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;outline:none}
.psheet .g{font-size:12px;color:var(--muted);padding:12px 16px 4px}
.psheet .it{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;font-size:15px;color:var(--text)!important;text-decoration:none!important}
.psheet .it.on{background:var(--selected)}
.psheet .it .kbd{margin-left:auto}
.psheet .note{font-size:12px;color:var(--muted);padding:12px 16px;margin:0;border-top:1px solid var(--border);margin-top:auto}
</style>
</helmet>
<div class="{{theme}}">
<div class="psheet" role="dialog" aria-label="移動と操作">
  <div class="q"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" aria-label="移動先を入力" placeholder="移動先を入力"><button class="m-icon" type="button" aria-label="閉じる"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
  <div class="g">移動</div>
  <a class="it on" href="MobileHome.dc.html">ホーム</a>
  <a class="it" href="MobileApprovals.dc.html">承認待ちの一覧</a>
  <a class="it" href="MobilePlans.dc.html">開発計画</a>
  <a class="it" href="Mobile.dc.html">スプリントの一覧</a>
  <a class="it" href="MobileLoops.dc.html">ループ</a>
  <a class="it" href="MobileRepositories.dc.html">リポジトリ</a>
  <a class="it" href="MobilePhysical.dc.html">マシンと実行</a>
  <a class="it" href="MobileRoles.dc.html">役割の流れ</a>
  <a class="it" href="MobileSettingsMenu.dc.html">アカウントの設定</a>
  <a class="it" href="MobileAccount.dc.html">自分の設定</a>
  <div class="g">キーボード</div>
  <a class="it" href="MobileMeKeyboard.dc.html">ショートカットの一覧</a>
  <a class="it" href="MobileMeKeyboard.dc.html">1 文字のショートカットを止める</a>
  <p class="note">スマホでは画面いっぱいに開き、候補の行は高さ 44px。ショートカットの印はキーボードのある端末でだけ出す。候補は行き先・ショートカットの一覧・1 文字のショートカットの切り替えの 3 種類だけ</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
