<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: キーボード</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileAccount.dc.html" aria-label="自分の設定へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">キーボード</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">1 文字のショートカットを使うかを切り替えます</p>
  <div class="m-body">
    <p class="sm muted" style="margin:0">1 文字のショートカット（/・?・G に続く 1 文字）を使うかを決めます。この設定はこの端末のブラウザにだけ残ります</p>
    <div class="card"><div class="card-b"><label class="check"><input type="checkbox" checked=""><span>1 文字のショートカットを使う</span></label><span class="xs muted">止めても ⌘K・Ctrl+K と Esc は効きます</span></div></div>
    <section class="card"><div class="card-h"><h3>ショートカットの一覧</h3></div>
      <div class="card-b"><dl class="dl"><dt><span class="kbd">Ctrl K</span></dt><dd>コマンドパレットを開く</dd><dt><span class="kbd">/</span></dt><dd>画面の絞り込みの欄へ移る</dd><dt><span class="kbd">?</span></dt><dd>ショートカットの一覧を開く</dd><dt><span class="kbd">G H</span></dt><dd>ホームへ</dd><dt><span class="kbd">G A</span></dt><dd>承認待ちの一覧へ</dd><dt><span class="kbd">G S</span></dt><dd>スプリントの一覧へ</dd><dt><span class="kbd">G R</span></dt><dd>リポジトリへ</dd></dl><span class="xs muted">スマホではキーボードのある端末でだけ効きます</span></div>
    </section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
