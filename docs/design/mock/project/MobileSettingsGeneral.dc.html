<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スマホ: 一般</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./nd.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.m .check{min-height:44px;align-items:center}
.m .check input{margin-top:0}
.m .seg{height:44px;width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.m .seg button{justify-content:center;font-size:13px;padding:0 4px}
.m .tabs a{min-height:44px;display:inline-flex;align-items:center}
.m .btn.sm{height:44px;font-size:15px}
.m-row{display:flex;flex-direction:column;gap:12px}
.m .m-item .acts{display:flex;gap:8px;flex-wrap:wrap}
</style>
</helmet>
<div class="{{theme}}">
<div class="m">
  <header class="m-top">
    <a class="m-icon" href="MobileSettingsMenu.dc.html" aria-label="アカウントの設定へ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
    <span class="t">一般</span>
    <button class="m-icon" type="button" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
  </header><p class="m-desc">アカウントの名前・種類・料金プランと、既定の実行の手段を確かめます</p>
  <div class="m-body">
    <span class="sm muted">個人のアカウント</span>
    <section class="card"><div class="card-h"><h3>アカウント</h3></div>
      <div class="card-b"><dl class="dl"><dt>名前</dt><dd>個人のアカウント</dd><dt>種類</dt><dd>個人</dd><dt>料金プラン</dt><dd>Free<br><span class="xs muted">同時に動かせるスプリント 1 本</span></dd></dl></div>
    </section>
    <section class="card"><div class="card-h"><h3>実行</h3></div>
      <div class="card-b"><dl class="dl"><dt>既定の手段</dt><dd>手元のマシン（どの 1 台でも）</dd><dt>月の上限額</dt><dd>$50.00</dd><dt>使える量</dt><dd>今月 $3.42 / $50.00</dd></dl><a class="btn" href="MobileAccountSettings.dc.html">既定の手段と月の上限額を変える</a></div>
    </section>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'nd dark' : 'nd' };
  }
}
</script>
</body>
</html>
