# nd-factory の漏れの規則と作り物の値の許可（#1 の決定 3。中身は docs/design-process/issue-1/design-detail.md の「gitleaks の設定」）。
# [extend] を持たない: 既定の規則と既定の全体の許可（package-lock.json などのパス）を読まない。既定の規則は
# tools/checks/gitleaks-default.toml で別に探す。すべての実行は tools/checks/leak-scan.sh を通す。
# 許可は規則ごとの [[rules.allowlists]] に書く。最上位の [[allowlists]] の targetRules は、CI が秘密の規則を重ねる設定から
# [extend] path で読まれると効かないため使わない。正当な当たりは当てた規則の許可に、理由と課題の番号の注を添えて足す。
# 各規則の秘密（secretGroup）は値を見分ける部分（アカウント・資源の名前）にし、許可はその部分に掛ける
title = "nd-factory"

# 前後が英数字でない 12 桁。作り物の UUID（00000000-0000-7000-8000-<12 桁>）の最後の組を許可で見分けるため、
# UUID の前の 4 組があれば当てた文字列に含める。
# 境界は \b（文字を消費しない）で見て、隣り合う値（<12 桁>,<12 桁>）の間の 1 文字の区切りを次の値に残す。
# \b は _ を英数字と同じに扱うので、_ だけは消費して区切りとして受ける。_ 1 文字で 2 つの 12 桁を繋いだときの
# 後ろの値は、次の規則 nd-aws-account-id-joined が当てる
[[rules]]
id = "nd-aws-account-id"
description = "AWS のアカウント ID"
regex = '''(?:\b|_)(?:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-)?([0-9]{12})(?:\b|_)'''
secretGroup = 1

[[rules.allowlists]]
description = "作り物の値と印（AGENTS.md の「秘密とインフラの値を置かない」）と、置き場所の記号（<名前>・${名前} の全体。記号の 1 文字だけでは許さない）"
regexes = ['''123456789012''', '''^acme''', '''example\.com''', '''<[A-Za-z0-9_-]+>''', '''\$\{[^{}\s]+\}''', '''EXAMPLE''']

[[rules.allowlists]]
description = "別のアカウントの作り物。設置のコマンドのテストが、確認したアカウントと違う profile を作る（infra/test/nd-setup.test.ts。#1）"
regexes = ['''^210987654321$''']

[[rules.allowlists]]
description = "作り物の UUID の最後の組（docs/design/screens.md の「見本の値」の ID の形）"
regexTarget = "match"
regexes = ['''00000000-0000-7000-8000-[0-9]{12}''']

[[rules.allowlists]]
description = "DB の用意の要素の作り物の ID（packages/contracts/test/db-prep.test.ts の PREP_ID。#13 が足し、main の履歴に残る）"
regexTarget = "match"
regexes = ['''00000000-0000-4000-8000-000000000001''']

[[rules.allowlists]]
description = "横断の部品と行の形のテストとコードの作り物の UUID（#2）。空の ID（packages/core/src/conditional-write.ts）と、テストの principal・要求・成果物の ID（apps/api/test/api-fn.test.ts・packages/core/test/{http,dispatch}.test.ts・packages/contracts/test/artifacts.test.ts）。sprint/issue-2 の履歴に残る"
regexTarget = "match"
regexes = ['''00000000-0000-4000-8000-000000000000''', '''01890a5d-ac96-774b-bcce-0000000000[0-9]{2}''', '''0193a1b2-0000-7000-8000-0000000000[0-9]{2}''', '''01935b4e-0000-7000-8000-(?:000000000000|123456789013)''', '''0f1e2d3c-4b5a-4968-8776-655443322110''']

# _ 1 文字の後ろの 12 桁で、その _ の前も 12 桁のもの（<12 桁>_<12 桁> の後ろの値）。
# nd-aws-account-id は前の値の後ろの _ を消費するので、後ろの値をこの規則で当てる
[[rules]]
id = "nd-aws-account-id-joined"
description = "AWS のアカウント ID（_ で前の 12 桁と繋いだもの）"
regex = '''[0-9]{12}_([0-9]{12})(?:\b|_)'''
secretGroup = 1

[[rules.allowlists]]
description = "作り物の値と印（AGENTS.md の「秘密とインフラの値を置かない」）"
regexes = ['''123456789012''', '''^210987654321$''']

# アカウントの欄が 12 桁の ARN。秘密は ARN の全体（アカウントの欄の 12 桁は nd-aws-account-id も当てる）。
# 資源の欄は置き換え記号の全体か、空白・引用符・<>{} の外の文字。値に接した文書の区切り（<…> の閉じ・} ）を含めない。
# <…> は中に空白や日本語を持つ置き換え記号も含める（許可が ARN の全体を見分けられるようにする。#98）
[[rules]]
id = "nd-aws-arn"
description = "AWS の ARN（アカウントの欄つき）"
regex = '''arn:(?:aws|aws-cn|aws-us-gov):[a-z0-9-]+:[a-z0-9-]*:[0-9]{12}:(?:<[^<>"'`/\r\n]+>|\$\{[^{}\s]+\}|[^\s"'`<>{}])*'''

[[rules.allowlists]]
description = "置き換え記号の例（#98 の決定 5）。アカウントの欄が作り物で、資源の欄が置き換え記号と区切りだけ（前に role/ か policy/ を付けてよい）"
regexTarget = "match"
regexes = ['''^arn:(?:aws|aws-cn|aws-us-gov):[a-z0-9-]+:[a-z0-9-]*:123456789012:(?:role/|policy/)?(?:<[A-Za-z0-9_-]+>|\$\{[^{}\s]+\}|[.-])+$''']

# 資源の欄に名前を書く ARN の例を足すときは、この一覧に ARN の全体を 1 つ足す。
# このファイル自身が nd-aws-arn に当たらないよう、アカウントの欄の後ろの : は [:] と書く
[[rules.allowlists]]
description = "文書とテストの ARN の例（#98 の決定 5）。アカウントの欄が作り物で、資源の欄の名前は例のためのもの"
regexTarget = "match"
regexes = [
  '''^arn:aws:iam::123456789012[:]role/acme-deploy$''',
  '''^arn:aws:iam::123456789012[:]role/example$''',
  '''^arn:aws:iam::123456789012[:]role/<AI のロール>$''',
  '''^arn:aws:iam::123456789012[:]policy/acme-test-deny-approval$''',
  '''^arn:aws:ecs:ap-northeast-1:123456789012[:]task-definition/example:1$''',
  '''^arn:aws:rds:us-west-2:123456789012[:]cluster:acme-test-progress$''',
  '''^arn:aws:secretsmanager:us-west-2:123456789012[:]secret:acme/test/progress-db-admin-AbCdEf$''',
  '''^arn:aws:codepipeline:us-west-2:123456789012[:]acme-test-pipeline/Approve/Approve$''',
]

# アカウントとリージョンの欄の無い S3 の ARN。秘密は置き場の名前（置き場所の記号の全体か、名前に使える文字の並び）
[[rules]]
id = "nd-aws-arn-s3"
description = "S3 の置き場の ARN"
regex = '''arn:(?:aws|aws-cn|aws-us-gov):s3:::((?:<[A-Za-z0-9_-]+>|\$\{[^{}\s]+\}|[A-Za-z0-9._-])+)'''
secretGroup = 1

[[rules.allowlists]]
description = "置き換え記号（<名前>・${名前}）と区切り（.・-）だけでできた名前（#98 の決定 5 の許可 2）。実際の値の文字を含まない"
regexes = ['''^(?:<[A-Za-z0-9_-]+>|\$\{[^{}\s]+\}|[.-])+$''']

[[rules.allowlists]]
description = "S3 の例の置き場（#98 の決定 5 の許可 1）。AWS は amzn-s3-demo- で始まる置き場を作らせない。アクセスポイントの別名を通さないため、接頭辞の後ろは小文字と数字だけ"
regexes = ['''^amzn-s3-demo-[a-z0-9]+$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
commits = ["28057e3f0ee9ce072dc8b2e3c1023c6b682468c8"]
regexes = ['''^acme-assets$''', '''^assets\.example\.com$''', '''^nd-EXAMPLE-logs$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
commits = ["0cf8dcd571ce6b63825eb134ebb26def8118c1db"]
regexes = ['''^data-example\.com-logs$''']

# AWS の資源の ID（頭と 8 か 17 桁の 16 進）
[[rules]]
id = "nd-aws-resource-id"
description = "AWS の資源の ID"
regex = '''\b((?:vpc|subnet|sg|i|vol|snap|ami|igw|rtb|eni|nat|eipalloc|lt)-(?:[0-9a-f]{17}|[0-9a-f]{8}))\b'''
secretGroup = 1

# 資源ごとに名前の付く AWS の端点。秘密は資源の部分（サービスとリージョンより前のラベル）。
# ラベルは置き場所の記号（<名前>・${名前}）の全体か英数字と _- の並び。<実際の名前.cloudfront.net> の < は記号の一部にならず、秘密に含めない。
# S3 はリージョンなし（<bucket>.s3.amazonaws.com）・リージョンつき（<bucket>.s3.<region>.amazonaws.com・<bucket>.s3-<region>.amazonaws.com）・
# dualstack と website の形（<bucket>.s3.dualstack.<region>.amazonaws.com・<bucket>.s3-website-<region>.amazonaws.com）を当てる
[[rules]]
id = "nd-aws-endpoint"
description = "AWS の資源ごとの端点"
regex = '''((?:(?:<[A-Za-z0-9_-]+>|\$\{[^{}\s]+\}|[A-Za-z0-9_-])+\.)*(?:<[A-Za-z0-9_-]+>|\$\{[^{}\s]+\}|[A-Za-z0-9_-])+)\.(?:execute-api\.[^.\s"'`/]+\.amazonaws\.com|lambda-url\.[^.\s"'`/]+\.on\.aws|cloudfront\.net|auth\.[^.\s"'`/]+\.amazoncognito\.com|rds\.amazonaws\.com|s3(?:[.-][^.\s"'`/]+)*\.amazonaws\.com)'''
secretGroup = 1

[[rules.allowlists]]
description = "置き換え記号（<名前>・${名前}）と区切り（.・-）だけでできた名前（#98 の決定 5 の許可 2）。実際の値の文字を含まない"
regexes = ['''^(?:<[A-Za-z0-9_-]+>|\$\{[^{}\s]+\}|[.-])+$''']

[[rules.allowlists]]
description = "CloudFront の例（#98 の決定 5 の許可 3）。実在の配信の名前は d で始まるので、EXAMPLE と数字だけの名前の配信は無い"
regexTarget = "match"
regexes = ['''^EXAMPLE[0-9]+\.cloudfront\.net$''']

[[rules.allowlists]]
description = "Cognito のドメインの例（#98 の決定 5 の許可 4）。<prefix>-<environment>-login は docs/operations/idp-and-apps.md の形の例で、置き換え記号と固定の語 login だけ。cognito を含む名前は AWS が接頭辞のドメインに使わせない"
regexTarget = "match"
regexes = ['''^(?:<prefix>-<environment>-login|[a-z0-9-]*cognito[a-z0-9-]*)\.auth\.(?:<[^<>\s"'`/.]+>|us-west-2)\.amazoncognito\.com$''']

[[rules.allowlists]]
description = "S3 の例の置き場の端点（#98 の決定 5 の許可 1）。AWS は amzn-s3-demo- で始まる置き場を作らせない。アクセスポイントの別名を通さないため、接頭辞の後ろは小文字と数字だけ"
regexTarget = "match"
regexes = ['''^amzn-s3-demo-[a-z0-9]+\.s3(?:[.-][^.\s"'`/]+)*\.amazonaws\.com$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
regexTarget = "match"
commits = ["0cf8dcd571ce6b63825eb134ebb26def8118c1db", "551abec8ed02bbd3a635878e6e5d9c694c5822ce"]
regexes = ['''^EXAMPLE1234\.execute-api\.us-west-2\.amazonaws\.com$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
regexTarget = "match"
commits = ["0cf8dcd571ce6b63825eb134ebb26def8118c1db"]
regexes = ['''^data-example\.com-logs\.s3\.amazonaws\.com$''', '''^logs\.example\.com\.s3\.amazonaws\.com$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
regexTarget = "match"
commits = ["424cc11d4ccdeeb91da5dec217b97d1ed4f6265e", "69fd0b96383396fbf6f0091fa3b473d965918178", "a17398098db7265989071f0cfdfdd5aed2e8b3db", "ee58e0364b06253346a7e002773877bc303a366d"]
regexes = ['''^acme-bucket\.s3\.us-west-2\.amazonaws\.com$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
regexTarget = "match"
commits = ["28057e3f0ee9ce072dc8b2e3c1023c6b682468c8", "e49b177c4516475fdf7d8c1ce7a0dab989d9cd3c"]
regexes = ['''^acme-test-login\.auth\.us-west-2\.amazoncognito\.com$''']

[[rules.allowlists]]
description = "main の履歴に残る旧い作り物の値と、それを足したコミットの組（#98 の決定 5 の許可 5）。今の木と新しいコミットでは当たる"
condition = "AND"
regexTarget = "match"
commits = ["e49b177c4516475fdf7d8c1ce7a0dab989d9cd3c"]
regexes = ['''^acme-test\.auth\.us-west-2\.amazoncognito\.com$''']

# nd-factory のサービスが発行する token（形は docs/design/api.md の「認証と主体」。#98 の決定 1）。
# ID の部分の形は問わず、秘密の部分の長さ（base64url の 32 字以上）で当てる。許可は持たない
[[rules]]
id = "nd-delegation-token"
description = "nd-factory の委任の token"
regex = '''\bndfd_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{32,}'''

[[rules]]
id = "nd-machine-token"
description = "nd-factory の手元のマシンの登録の token"
regex = '''\bndfm_[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{32,}'''
