name: leak-check-secret

# 秘密を使う漏れの検査（#96 #101 の決定 1・4・5・7・8。中身は issues/issue-96-101-design-detail.md の「再利用できる漏れの検査のワークフロー」）。
# 検査用の非公開リポジトリの呼び出しのワークフロー（見本は docs/operations/leak-check-caller.yml）から workflow_call で呼ばれる。
# 実行は呼んだ側のリポジトリのものになり、記録は非公開リポジトリにだけ残る。NDF がマージの直前に起動し、この実行の結果だけを読む。
# 渡された Pull Request のマージコミットの木と、分岐点から head までのパッチと履歴の項目を、秘密を重ねた設定で探す。
# 動かすのは、検査のコードのコミットのチェックアウトにある git とスクリプトだけで、Pull Request のコミットの物は読むだけ。
# 形は tools/test/ci-definition.test.ts の secretWorkflowViolations が縛る。AWS の資格情報を持たない
on:
  workflow_call:
    inputs:
      pr_number:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      merge_sha:
        type: string
        required: true
      code_sha:
        type: string
        required: true
      generation:
        type: string
        required: true
    secrets:
      LEAK_CHECK_PATTERN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  leak-check-secret:
    # NDF は表示名の 6 つの値が渡した値と同じことを確かめる
    name: leak-check-secret (#${{ inputs.pr_number }} head ${{ inputs.head_sha }} / base ${{ inputs.base_sha }} / merge ${{ inputs.merge_sha }} / code ${{ inputs.code_sha }} / gen ${{ inputs.generation }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 入力は env で受け、run の中に式を書かない。形を確かめてから checkout の ref に渡す
      - name: 入力の形を確かめる
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          CODE_SHA: ${{ inputs.code_sha }}
          GENERATION: ${{ inputs.generation }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::入力 pr_number の形が違う"
            exit 1
          fi
          if [[ ! "$GENERATION" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::入力 generation の形が違う"
            exit 1
          fi
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::入力 head_sha の形が違う"
            exit 1
          fi
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::入力 base_sha の形が違う"
            exit 1
          fi
          if [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::入力 merge_sha の形が違う"
            exit 1
          fi
          if [[ ! "$CODE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::入力 code_sha の形が違う"
            exit 1
          fi
      # 検査のコード（スクリプトと設定）は、入力の検査のコードのコミットから取る。Pull Request のコミットはチェックアウトしない
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devbasex/nd-factory
          ref: ${{ inputs.code_sha }}
          fetch-depth: 0
          persist-credentials: false
      # 版と要約値は install-gitleaks.sh だけが持つ
      - name: gitleaks を固定の版と要約値で置く
        run: tools/checks/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      # 探す木を、表示名に入る head と base に結び付ける
      - name: Pull Request の参照を取り込んで確かめる
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          if ! git fetch --no-tags --no-recurse-submodules origin "+refs/pull/$PR_NUMBER/head:refs/ndf-scan/head" "+refs/pull/$PR_NUMBER/merge:refs/ndf-scan/merge"; then
            echo "::error::Pull Request の参照を取り込めない"
            exit 1
          fi
          if [[ "$(git rev-parse --verify refs/ndf-scan/head)" != "$HEAD_SHA" ]]; then
            echo "::error::refs/pull/$PR_NUMBER/head が入力の head の SHA と違う"
            exit 1
          fi
          if [[ "$(git rev-parse --verify refs/ndf-scan/merge)" != "$MERGE_SHA" ]]; then
            echo "::error::refs/pull/$PR_NUMBER/merge が入力の merge の SHA と違う"
            exit 1
          fi
          if [[ "$(git rev-list --parents -n 1 "$MERGE_SHA")" != "$MERGE_SHA $BASE_SHA $HEAD_SHA" ]]; then
            echo "::error::マージコミットの親が入力の base と head でない"
            exit 1
          fi
          if ! git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null; then
            echo "::error::base と head の分岐点を求められない"
            exit 1
          fi
      # Git に保存された内容のまま、作業ツリーの外の固定のパスへ取り出す（.gitattributes を読まない）
      - name: マージコミットの木と履歴の項目を取り出す
        env:
          MERGE_SHA: ${{ inputs.merge_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          tools/checks/export-tree.sh "$MERGE_SHA" "$RUNNER_TEMP/merge-tree"
          fork_point="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          tools/checks/export-tree.sh --history "$fork_point" "$HEAD_SHA" "$RUNNER_TEMP/history"
      # 秘密を受けるのはこの手順だけ。必須にして、秘密が空なら落とす。前の呼び出しが失敗しても次を打つ
      - name: 秘密の規則を重ねて探す
        env:
          LEAK_CHECK_PATTERN: ${{ secrets.LEAK_CHECK_PATTERN }}
          LEAK_CHECK_REQUIRE_PATTERN: "1"
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          status=0
          fork_point="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          tools/checks/leak-scan-secret.sh dir "$RUNNER_TEMP/merge-tree" || status=1
          tools/checks/leak-scan-secret.sh history "$RUNNER_TEMP/history" || status=1
          tools/checks/leak-scan-secret.sh git --range "$fork_point..$HEAD_SHA" || status=1
          exit "$status"
