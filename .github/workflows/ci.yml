name: ci

# AWS の資格情報を持たない。合成は作り物のアカウント・リージョン・設定のファイルで行う
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # DB の用意の手順を pg の実装で打つテストの相手。イメージは要約値で固定する
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          # 使い捨てのコンテナの作り物の値
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 値が無いと、CI では DB のテストが落ちる
      ND_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      # このジョブだけの使い捨てのコンテナ。クラスタ全体の権限を変える DB のテストを許す
      ND_TEST_PG_DISPOSABLE_CLUSTER: "1"
      # 認証の時間切れを短くして起こした、認証の時間切れのテストだけが使うコンテナ（下の手順で起こす）
      ND_TEST_PG_AUTH_TIMEOUT_URL: postgres://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # サーバーの設定を起動の引数で決める（サービスコンテナは起動の引数を渡せない）。ほかのテストが使うクラスタの設定を
      # ALTER SYSTEM で変えないため、別のコンテナにする。値はテストの PG_AUTH_TIMEOUT_S と同じ
      - name: 認証の時間切れを短くした PostgreSQL を起こす
        run: |
          docker run -d --name pg-auth-timeout -p 5433:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f -c authentication_timeout=3s
          for _ in $(seq 60); do
            docker exec pg-auth-timeout pg_isready -U postgres -h localhost && exit 0
            sleep 1
          done
          docker logs pg-auth-timeout
          exit 1
      - name: lint・型検査・生成物の差・単体テストとスタックのテスト
        run: npm run check

  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 手元の資格情報や EC2 のメタデータを探しに行かない
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 画面をビルドする
        run: npm run build:web
      - name: 作り物の値で合成する
        run: npm run synth

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: ブラウザーを入れる
        run: npx playwright install --with-deps chromium
      - name: 画面の e2e（利用者プールと API はネットワークの手前で差し替える）
        run: npm run e2e

  ref-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: 参照の検査
        env:
          # 照合の語は秘密から受ける。リポジトリのファイルに置かない
          REF_CHECK_TERMS: ${{ secrets.REF_CHECK_TERMS }}
          # 語を必須にするのは、変数で有効にした正本のリポジトリの中の実行（main への push と同じリポジトリの枝からの PR）だけ
          REF_CHECK_REQUIRE_TERMS: ${{ (vars.REF_CHECK_REQUIRE_TERMS == '1' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '' }}
        run: npm run ref-check
