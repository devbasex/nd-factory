name: ci

# AWS の資格情報を持たない。合成は作り物のアカウント・リージョン・設定のファイルで行う
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # DB の用意の手順を pg の実装で打つテストの相手。イメージは要約値で固定する
      postgres:
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          # 使い捨てのコンテナの作り物の値
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # 値が無いと、CI では DB のテストが落ちる
      ND_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      # このジョブだけの使い捨てのコンテナ。クラスタ全体の権限を変える DB のテストを許す
      ND_TEST_PG_DISPOSABLE_CLUSTER: "1"
      # 認証の時間切れを短くして起こした、認証の時間切れのテストだけが使うコンテナ（下の手順で起こす）
      ND_TEST_PG_AUTH_TIMEOUT_URL: postgres://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # サーバーの設定を起動の引数で決める（サービスコンテナは起動の引数を渡せない）。ほかのテストが使うクラスタの設定を
      # ALTER SYSTEM で変えないため、別のコンテナにする。値はテストの PG_AUTH_TIMEOUT_S と同じ
      - name: 認証の時間切れを短くした PostgreSQL を起こす
        run: |
          docker run -d --name pg-auth-timeout -p 5433:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f -c authentication_timeout=3s
          for _ in $(seq 60); do
            docker exec pg-auth-timeout pg_isready -U postgres -h localhost && exit 0
            sleep 1
          done
          docker logs pg-auth-timeout
          exit 1
      - name: lint・型検査・生成物の差・単体テストとスタックのテスト
        run: npm run check
      - name: 置き場の間の依存の向き
        run: npm run deps-check
      - name: 使っていないファイル・書き出し・依存
        run: npm run knip

  synth:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # 手元の資格情報や EC2 のメタデータを探しに行かない
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 画面をビルドする
        run: npm run build:web
      - name: 作り物の値で合成する
        run: npm run synth

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: ブラウザーを入れる
        run: npx playwright install --with-deps chromium
      - name: 画面の e2e（利用者プールと API はネットワークの手前で差し替える）
        run: npm run e2e

  ref-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: 参照の検査
        env:
          # 照合の語は秘密から受ける。リポジトリのファイルに置かない
          REF_CHECK_TERMS: ${{ secrets.REF_CHECK_TERMS }}
          # 語を必須にするのは、変数で有効にした正本のリポジトリの中の実行（main と develop への push と同じリポジトリの枝からの PR）だけ
          REF_CHECK_REQUIRE_TERMS: ${{ (vars.REF_CHECK_REQUIRE_TERMS == '1' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && '1' || '' }}
        run: npm run ref-check

  # Pull Request の漏れの検査。秘密と環境を持たず、既定の規則と .gitleaks.toml だけで探す（#96 #101 の決定 3）。
  # 実際の値の規則での Pull Request の探しは、NDF がマージの直前に検査用の非公開リポジトリで起動する
  # leak-check-secret.yml が行う（docs/operations/ci-checks.md）
  leak-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # 版と要約値は install-gitleaks.sh だけが持つ
      - name: gitleaks を固定の版と要約値で置く
        run: tools/checks/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      # 依存を入れる前に探す（追跡していないファイルは木に無い）。今の木と分岐点から head までを、既定の規則と nd-factory の規則の 2 回ずつ
      - name: 今の木と履歴のコミットを探す
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tools/checks/leak-scan.sh dir tools/checks/gitleaks-default.toml
          tools/checks/leak-scan.sh dir .gitleaks.toml
          fork_point="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          tools/checks/leak-scan.sh git tools/checks/gitleaks-default.toml --range "$fork_point..$HEAD_SHA"
          tools/checks/leak-scan.sh git .gitleaks.toml --range "$fork_point..$HEAD_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: gitleaks の設定の結合のテスト
        run: npm run test:integration -- leak-scan

  # main と develop への push の漏れの検査。環境 leak-scan（使えるブランチは main と develop だけ）の秘密で実際の値の規則を重ね、
  # nd-real-value の当たりは件数だけを出す（#96 #101 の決定 8・9）。必須のチェックではない。
  # 依存を入れない（環境の秘密を持つジョブで依存の導入の処理を動かさない。結合のテストは Pull Request の leak-check が打つ）
  leak-check-push:
    if: github.event_name == 'push'
    environment: leak-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # 版と要約値は install-gitleaks.sh だけが持つ
      - name: gitleaks を固定の版と要約値で置く
        run: tools/checks/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
      # 今の木と、到達できるすべてのコミットを探す。push の前後（before..after）に絞らない: 打ち消された実行・強制の push・
      # 同じ並びの待ちの打ち切りで飛ばした push の間のコミットも漏らさないため。1 回目が失敗しても 2 回目を打つ
      - name: 今の木と履歴のコミットを探す
        env:
          # 実際の値の正規表現は環境の秘密から受ける。リポジトリのファイルに置かない
          LEAK_CHECK_PATTERN: ${{ secrets.LEAK_CHECK_PATTERN }}
          # 変数で必須にすると、秘密が空なら落ちる
          LEAK_CHECK_REQUIRE_PATTERN: ${{ vars.LEAK_CHECK_REQUIRE_PATTERN == '1' && '1' || '' }}
        run: |
          status=0
          tools/checks/leak-scan-secret.sh dir --count-only || status=1
          tools/checks/leak-scan-secret.sh git --count-only || status=1
          exit "$status"

  workflow-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # 版と要約値は手で上げる。要約値は配布の資産を取って sha256sum で求めた値（配布元は要約値のファイルを出さない）
      ZIZMOR_VERSION: 1.32.0
      ZIZMOR_SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor を固定の版と要約値で置く
        run: |
          dir="$RUNNER_TEMP/zizmor"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  $dir/zizmor.tar.gz" | sha256sum --check --strict -
          tar -xzf "$dir/zizmor.tar.gz" -C "$dir" zizmor
          echo "$dir" >> "$GITHUB_PATH"
      # tools/test/workflow-audit.integration.test.ts がこの手順の run を読んで同じ引数で打つ
      - name: ワークフローの点検
        run: zizmor --offline --no-ignores --config .github/zizmor.yml .github/workflows
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: zizmor の設定の結合のテスト
        run: npm run test:integration -- workflow-audit
